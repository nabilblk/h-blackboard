[workspace]
members = ["crates/harakiri-protocol", "crates/harakiri-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
ciborium = "0.2.2"
coset = "=0.4.2"
ed25519-dalek = "=3.0.0"
hex = "0.4.3"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-mdns-address-lookup = "=0.6.0"
n0-future = "=0.3.2"
rand = "0.9"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
zeroize = "=1.9.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
